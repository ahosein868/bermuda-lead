# Bermuda B2B Lead Scraper configuration.

http:
  user_agent: "BermudaLeadScraper/0.1 (+hosein.andrew@gmail.com)"
  requests_per_second: 1.0      # per host
  timeout_seconds: 30
  max_retries: 3
  cache_dir: "data/cache"

sources:
  bermudayp:
    enabled: true
    sitemap_index: "https://www.bermudayp.com/sitemapxml/sitemap_index_47.xml"
    # Category search pages give real category labels but cost ~800+ requests.
    # Enable with `run.py scrape --with-categories`.
    category_max_pages: 3
  chamber:
    enabled: true
    base: "https://www.bermudachamber.bm"
    alpha_keys: "0abcdefghijklmnopqrstuvwxyz"

enrich:
  max_pages_per_site: 3
  page_paths: ["/contact", "/contact-us", "/about", "/about-us"]
  max_text_chars: 6000
  dns_enabled: true
  checkpoint_every_records: 100   # save progress every N records

# Role-based addresses are business contacts. Anything else is flagged personal
# and excluded from the CRM export by default (Bermuda PIPA).
role_email_prefixes:
  - info
  - sales
  - contact
  - office
  - admin
  - enquiries
  - inquiries
  - hello
  - support
  - reception
  - mail
  - general
  - service
  - customerservice
  - bookings
  - reservations

# Telecom / IT vendors to detect as the prospect's CURRENT providers.
providers:
  telecom:
    - {vendor: "One Communications", patterns: ["one communications", "onecomm", "@one.bm", "logic.bm", "north rock", "northrock", "bermuda cablevision"]}
    - {vendor: "Digicel", patterns: ["digicel", "@digicel.bm"]}
    - {vendor: "Paradise Mobile", patterns: ["paradise mobile", "paradisemobile"]}
    - {vendor: "TeleBermuda International", patterns: ["telebermuda", " tbi ", "@tbi.bm"]}
    - {vendor: "Bermuda Digital Communications", patterns: ["bermuda digital communications", "cellone", "cell one"]}
  it_managed:
    - {vendor: "Fireminds", patterns: ["fireminds"]}
    - {vendor: "Gateway Systems", patterns: ["gateway systems"]}
    - {vendor: "QuoVadis", patterns: ["quovadis"]}
    - {vendor: "Applied Computer Technologies", patterns: ["applied computer technologies", " act ltd"]}
    - {vendor: "CedarBridge / TeleCentre", patterns: ["telecentre"]}

