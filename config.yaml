taxonomy:
  sectors:
    - "Hospitality & Tourism"
    - "Insurance & Reinsurance"
    - "Banking & Financial Services"
    - "Legal & Corporate Services"
    - "Retail"
    - "Construction & Real Estate"
    - "Healthcare"
    - "Education"
    - "Transportation & Logistics"
    - "Professional Services"
    - "Technology & Telecom"
    - "Government & Non-profit"
    - "Food & Beverage"
    - "Other"
  size_tiers:
    - "Micro"      # <10 staff
    - "Small"      # 10-49
    - "Medium"     # 50-249
    - "Large"      # 250+
    - "Unknown"
  geo_scopes:
    - "Local"      # Bermuda only
    - "Regional"   # Caribbean / North America
    - "Global"
    - "Unknown"

classify:
  cli: "claude"
  model: "sonnet"
  batch_size: 15
  checkpoint_every_batches: 5   # save progress every N batches
  max_retries: 2
  timeout_seconds: 600

export:
  markdown_path: "business-leads.md"
  csv_path: "leads.csv"
  suppress_file: "suppress.txt"
  include_personal_emails: false
